<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>그래프 ASMR 오비</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#d9c8ff;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.st{text-shadow:0 2px 0 #4a2a6a,0 0 3px #4a2a6a,2px 0 0 #4a2a6a,-2px 0 0 #4a2a6a,0 -2px 0 #4a2a6a}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto;cursor:pointer}
.gpill{background:linear-gradient(90deg,#a98bff,#ff8fb1);border:3px solid #fff;border-radius:16px;box-shadow:0 4px 0 rgba(90,50,140,.45)}
#stageBox{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#stageRow{display:flex;gap:8px;align-items:center}
#stageN{font-size:40px;min-width:150px;text-align:center;padding:2px 18px;line-height:1.2}
#stageN small{font-size:16px;display:block;line-height:1}
#tpB{font:inherit;font-size:18px;color:#fff;padding:5px 16px}
#secTag{position:absolute;left:10px;top:10px;font-size:17px;padding:6px 12px;max-width:34vw}
#sideBtns{position:absolute;left:10px;top:64px;display:flex;flex-direction:column;gap:8px}
.sb{width:62px;height:62px;font:inherit;font-size:13px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.sb b{font-size:24px;font-weight:normal}
#coinBox{position:absolute;left:10px;bottom:12px;font-size:28px;padding:6px 18px;display:flex;align-items:center;gap:8px}
#coinBox.hit{animation:shk .45s;background:linear-gradient(90deg,#ff5a6e,#ff8fb1)}
#coinBox .ic{background:#ff6fa5;border:2px solid #fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:18px}
#plus{position:absolute;left:190px;bottom:20px;font-size:30px;color:#7dff8a;opacity:0}
#plus.on{animation:pl .6s}
#mini{position:absolute;right:10px;top:10px;width:130px;height:130px;border-radius:50%;border:3px solid #fff;background:rgba(150,120,220,.55);box-shadow:0 4px 0 rgba(90,50,140,.45)}
#chat{position:absolute;left:84px;top:66px;width:min(380px,48vw);display:flex;flex-direction:column;gap:4px}
.cm{background:rgba(120,80,200,.72);border:2px solid rgba(255,255,255,.7);border-radius:12px;padding:6px 10px;font-size:16px;line-height:1.4;animation:cin .3s;transition:opacity .8s}
.cm b{color:#ffe14d}
#zoomB{position:absolute;right:10px;top:150px;font:inherit;font-size:16px;color:#fff;padding:7px 12px;animation:pulse 1s infinite}
#banner{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);text-align:center;opacity:0;white-space:nowrap}
#banner.on{animation:ban 2.6s forwards}
#ban1{font-size:24px}#ban2{font-size:clamp(34px,6vw,60px)}
.popf{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:40px;pointer-events:none;z-index:30;animation:popf 1.2s forwards;white-space:nowrap}
.snd{position:fixed;font-size:26px;pointer-events:none;z-index:29;animation:snd .8s forwards;white-space:nowrap}
#tip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(110,70,190,.75);border:2px solid #fff;padding:6px 14px;border-radius:12px;font-size:14px;z-index:5;pointer-events:none}
#joy{position:fixed;left:3vw;bottom:9vh;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.7);z-index:8;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:rgba(255,255,255,.85)}
#jumpB,#runB{position:fixed;z-index:8;border-radius:50%;border:3px solid #fff;background:rgba(169,139,255,.55);color:#fff;font:inherit;touch-action:none}
#jumpB{right:4vw;bottom:8vh;width:96px;height:96px;font-size:40px}
#runB{right:calc(4vw + 106px);bottom:7vh;width:66px;height:66px;font-size:26px}
#runB.on{background:rgba(255,143,177,.85)}
#scare{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:radial-gradient(circle,rgba(60,0,60,.2),rgba(20,0,30,.85));pointer-events:none}
#scare.on{display:grid;animation:shk .5s}
#scare .face{width:min(70vmin,520px);animation:scin .6s cubic-bezier(.2,1.5,.4,1) forwards}
#scare .stxt{position:absolute;bottom:12%;font-size:clamp(50px,11vw,110px);color:#fff;text-shadow:0 0 20px #f0f,0 6px 0 #000;animation:scin .5s}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .25s}
#flash{position:fixed;inset:0;pointer-events:none;z-index:41;opacity:0}
#flash.g{background:radial-gradient(circle,rgba(140,255,170,.5),transparent 70%);animation:fl .7s}
#flash.r{background:radial-gradient(circle,transparent 30%,rgba(255,60,90,.5));animation:fl .7s}
.panel{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(80,50,140,.45)}
.pbox{background:linear-gradient(#b79cff,#ff9fbe);border:4px solid #fff;border-radius:22px;padding:20px 22px;width:min(420px,92vw);text-align:center;box-shadow:0 8px 0 rgba(90,50,140,.4)}
.pbox h2{font-size:30px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;font-size:19px}
.row input[type=range]{flex:1;accent-color:#7c3aed}
.tog{font:inherit;font-size:16px;color:#fff;background:rgba(80,40,150,.5);border:2px solid #fff;border-radius:10px;padding:5px 12px;min-width:96px;cursor:pointer}
.gbtn{border:3px solid #fff;border-radius:16px;padding:12px 26px;font:inherit;font-size:22px;color:#fff;cursor:pointer;background:linear-gradient(#5fe08a,#29b862);box-shadow:0 5px 0 #1a7a40;margin:6px}
#title{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.15),rgba(120,80,200,.55))}
.tc{text-align:center;padding:16px}
.logo{font-size:clamp(46px,9vw,96px);line-height:1.02;color:#fff;text-shadow:0 5px 0 #8b5cf6,0 10px 0 #5b21b6,0 14px 20px rgba(60,20,120,.4)}
.logo span{display:block;color:#ffe14d;text-shadow:0 5px 0 #ff6fa5,0 10px 0 #c0306a}
.tsub{font-size:20px;margin:18px 0}
#nameI{font:inherit;font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid #fff;background:rgba(255,255,255,.85);color:#5b21b6;text-align:center;width:min(280px,80vw);outline:none;margin-bottom:12px}
.load{font-size:15px;margin-top:10px}
#zoomV{position:fixed;inset:0;z-index:65;background:rgba(60,30,110,.8);display:grid;place-items:center}
#zoomV img{max-width:96vw;max-height:88vh;border-radius:14px;border:4px solid #fff}
#err{position:fixed;inset:0;display:none;place-items:center;z-index:99;background:#5b21b6;color:#fff;font-size:20px;text-align:center;padding:20px}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-10px,5px)}40%{transform:translate(9px,-7px)}60%{transform:translate(-7px,-4px)}80%{transform:translate(5px,7px)}}
@keyframes pl{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
@keyframes cin{from{opacity:0;transform:translateX(-20px)}}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes popf{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-140%)}}
@keyframes snd{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:translateY(-40px) scale(1)}}
@keyframes scin{from{transform:scale(.1) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes fl{from{opacity:1}to{opacity:0}}
@keyframes pulse{50%{filter:brightness(1.25)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
 <div id="secTag" class="gpill st"></div>
 <div id="stageBox"><div id="stageRow"><div id="stageN" class="gpill st">1</div></div><button id="tpB" class="gpill st">↩ 텔레포트</button></div>
 <div id="sideBtns"><button class="sb gpill st" id="viewB"><b>👁</b>1인칭</button><button class="sb gpill st" id="setB"><b>⚙️</b>설정</button></div>
 <div id="chat" class="st"></div>
 <canvas id="mini" width="130" height="130"></canvas>
 <button id="zoomB" class="gpill st hidden">🔍 문제 크게 (Q)</button>
 <div id="coinBox" class="gpill st"><span class="ic">🪙</span><b id="coinN">0</b></div><div id="plus" class="st">+1</div>
 <div id="banner"><div id="ban1" class="st"></div><div id="ban2" class="st"></div></div>
</div>
<div id="tip" class="hidden st">🖱 화면 클릭 = 마우스로 시점 회전 (ESC 해제) · WASD 이동 · SPACE 점프 · SHIFT 달리기 · V 시점</div>
<div id="joy" class="hidden"><div id="knob"></div></div><button id="jumpB" class="hidden">⤒</button><button id="runB" class="hidden">🏃</button>
<div id="scare"></div><div id="fade"></div><div id="flash"></div>
<div id="title"><div class="tc"><div class="logo st">그래프<span>ASMR 오비</span></div><div class="tsub st">키보드 딸깍 · 왁스볼 콰자작 · 초콜릿 토도독 · 젤리 스퀴시<br>스테이지 끝마다 꺾은선그래프 문제! 틀리면 코인 왕창 잃어요 👻</div><input id="nameI" maxlength="8" placeholder="닉네임"><br><button class="gbtn" id="playB">▶ 플레이</button><div class="load st" id="loadT">불러오는 중…</div></div></div>
<div id="settings" class="panel hidden"><div class="pbox"><h2 class="st">⚙️ 설정</h2>
 <div class="row st">🎵 배경음악<input type="range" id="bgmR" min="0" max="1" step=".05"></div>
 <div class="row st">🔊 효과음<input type="range" id="sfxR" min="0" max="1" step=".05"></div>
 <div class="row st">🖱 마우스 감도<input type="range" id="senR" min=".3" max="2" step=".1"></div>
 <div class="row st">🖼 그래픽<button class="tog st" id="qualT"></button></div>
 <div class="row st">👻 깜짝 놀람(왁!)<button class="tog st" id="scareT"></button></div>
 <div class="row st">👁 시점<button class="tog st" id="viewT"></button></div>
 <button class="gbtn" id="setClose">닫기</button></div></div>
<div id="zoomV" class="hidden"><img id="zoomI" alt="문제"></div>
<div id="err">3D 엔진을 불러오지 못했어요 😢<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b)};
const fmt=v=>{v=Math.round(v*100)/100;return v>=1000?v.toLocaleString('ko-KR'):String(v)};
const T1={hw:'높은',lw:'낮은',uw:'오른',dw:'내려간'};
const CTX=[
{t:'시각별 오늘의 기온',x:'시각',y:'기온',u:'℃',xs:'time',step:1,shape:'hill',lo:8,hi:27,col:'b',...T1},
{t:'시각별 교실의 온도',x:'시각',y:'온도',u:'℃',xs:'time',step:1,shape:'hill',lo:10,hi:24,col:'b',...T1},
{t:'시각별 수영장 물의 온도',x:'시각',y:'온도',u:'℃',xs:'time',step:1,shape:'hill',lo:18,hi:31,col:'b',...T1},
{t:'요일별 운동장의 온도',x:'요일',y:'온도',u:'℃',xs:'weekday',step:1,shape:'wave',lo:5,hi:22,col:'b',...T1},
{t:'월별 새끼 고양이의 무게',x:'월',y:'무게',u:'kg',xs:'month',step:.1,shape:'up',lo:.3,hi:2.4,col:'g',hw:'무거운',lw:'가벼운',uw:'늘어난',dw:'줄어든'},
{t:'주별 방울토마토 줄기의 길이',x:'주',y:'길이',u:'cm',xs:'week',step:2,shape:'up',lo:2,hi:40,col:'g',hw:'긴',lw:'짧은',uw:'자란',dw:'줄어든'},
{t:'날짜별 해바라기의 키',x:'날짜',y:'키',u:'cm',xs:'day',step:5,shape:'up',lo:10,hi:120,col:'g',hw:'큰',lw:'작은',uw:'자란',dw:'줄어든'},
{t:'연도별 우리 학교 학생 수',x:'연도',y:'학생 수',u:'명',xs:'year',step:10,shape:'down',lo:300,hi:560,col:'b',hw:'많은',lw:'적은',uw:'늘어난',dw:'줄어든'},
{t:'월별 강아지의 키',x:'월',y:'키',u:'cm',xs:'month',step:1,shape:'up',lo:22,hi:48,col:'g',hw:'큰',lw:'작은',uw:'자란',dw:'줄어든'},
{t:'시각별 막대 그림자의 길이',x:'시각',y:'길이',u:'cm',xs:'time',step:10,shape:'valley',lo:40,hi:220,col:'b',hw:'긴',lw:'짧은',uw:'늘어난',dw:'줄어든'},
{t:'월별 저금통에 모은 돈',x:'월',y:'금액',u:'원',xs:'month',step:500,shape:'up',lo:1000,hi:15000,col:'g',hw:'많은',lw:'적은',uw:'늘어난',dw:'줄어든'},
{t:'월별 도서관 대출 책 수',x:'월',y:'책 수',u:'권',xs:'month',step:2,shape:'wave',lo:10,hi:58,col:'b',hw:'많은',lw:'적은',uw:'늘어난',dw:'줄어든'},
];
const XU={time:'시',month:'월',week:'주',day:'일',year:'년',weekday:''};
function labelOf(c,n){switch(c.xs){
 case 'time':return n<12?{s:''+n,sub:'오전',f:`오전 ${n}시`}:n===12?{s:'12',sub:'낮',f:'낮 12시'}:{s:''+(n-12),sub:'오후',f:`오후 ${n-12}시`};
 case 'month':return{s:''+n,f:n+'월'};case 'week':return{s:''+n,f:n+'주'};case 'day':return{s:''+n,f:n+'일'};case 'year':return{s:''+n,f:n+'년'};
 default:return{s:'월화수목금'[n],f:'월화수목금'[n]+'요일'}}}
function genNums(c,n,iv){let st=0,d=iv;
 if(c.xs==='time')st=iv===1?R(9,10):9;else if(c.xs==='month')st=iv===1?R(3,6):3;else if(c.xs==='week')st=1;else if(c.xs==='day'){st=1;d=3*iv}else if(c.xs==='year')st=iv===1?R(2018,2020):2016;
 return Array.from({length:n},(_,i)=>st+i*d)}
function genSeries(c,n,shape){const loK=Math.round(c.lo/c.step),hiK=Math.round(c.hi/c.step),span=hiK-loK,mi=Math.max(1,Math.round(span/(n-1)*.9));
 for(let t=0;t<300;t++){let ks,k;
  if(shape==='up'||shape==='down'){k=R(loK,loK+Math.floor(span/4));ks=[k];for(let i=1;i<n;i++){k+=R(1,mi);ks.push(k)}if(shape==='down')ks.reverse()}
  else if(shape==='hill'||shape==='valley'){const p=R(1,n-2);k=R(loK,loK+Math.floor(span/3));ks=[k];for(let i=1;i<n;i++){k+=i<=p?R(1,mi):-R(1,mi);ks.push(k)}if(shape==='valley')ks=ks.map(v=>loK+hiK-v)}
  else{k=R(loK+Math.floor(span/4),hiK-Math.floor(span/4));ks=[k];for(let i=1;i<n;i++){k+=(Math.random()<.5?-1:1)*R(1,mi);ks.push(k)}}
  if(ks.every(v=>v>=loK&&v<=hiK))return ks}
 return Array.from({length:n},(_,i)=>loK+i)}
function makeGraph(o={}){const c=o.c||pick(CTX.filter(o.filter||(()=>true)));const iv=o.iv||1;const n=o.n||(c.xs==='weekday'?5:R(4,6));
 const nums=genNums(c,n,iv),xs=nums.map(v=>labelOf(c,v)),ks=genSeries(c,n,o.shape||c.shape);
 const maxK=Math.max(...ks),minK=Math.min(...ks);const yMaxK=(Math.floor(maxK/5)+1)*5;const yMinK=minK>=20?(Math.floor(minK/5)-1)*5:0;
 return{c,nums,xs,ks,yMinK,yMaxK,wave:yMinK>0,kind:'line',hide:-1}}
const V=(g,k)=>fmt(k*g.c.step)+g.c.u;
const ie=w=>josa(w,'이에요','예요');
function numChoices(k,g){const set=new Set([k]);for(const d of shuffle([1,-1,2,-2,5,-5,3,-3,10])){if(set.size>=4)break;if(k+d>=0)set.add(k+d)}return shuffle([...set]).map(x=>V(g,x))}
const LINE_S=['하루 동안 운동장 기온의 변화','1년 동안 내 키의 변화','월별 강아지 몸무게의 변화','주별 콩나물 키의 변화','연도별 우리 마을 인구의 변화','시각별 교실 온도의 변화','요일별 줄넘기 기록의 변화'];
const BAR_S=['좋아하는 과일별 학생 수','반별 안경 쓴 학생 수','마을별 나무의 수','좋아하는 운동별 학생 수','취미별 학생 수','동물원의 동물별 마릿수','반별 모은 빈 병의 수'];
const updn=c=>c.u==='℃'?['올라갔어요','내려갔어요']:['늘어났어요','줄어들었어요'];
function uniqExt(hi){for(let t=0;t<60;t++){const g=makeGraph();const m=hi?Math.max(...g.ks):Math.min(...g.ks);if(g.ks.filter(k=>k===m).length===1)return[g,g.ks.indexOf(m)]}const g=makeGraph({shape:'up'});return[g,hi?g.ks.length-1:0]}
const GEN={
title(){const g=makeGraph();const others=shuffle(CTX.filter(c=>c.t!==g.c.t&&!(c.x===g.c.x&&c.y===g.c.y))).slice(0,3).map(c=>c.t);
 return{p:'🔍 앗! 그래프 제목이 사라졌어요. 무엇을 조사하여 나타낸 그래프일까요?',g,hideTitle:1,ch:shuffle([g.c.t,...others]),a:g.c.t,e:`가로는 <b>${g.c.x}</b>, 세로는 <b>${g.c.y}(${g.c.u})</b>예요. 그래서 '${g.c.t}' 그래프랍니다.`}},
axis(){const g=makeGraph();const isX=Math.random()<.5;const a=isX?g.c.x:g.c.y,o=isX?g.c.y:g.c.x;const pool=shuffle([...new Set(CTX.flatMap(c=>[c.x,c.y]))].filter(w=>w!==a&&w!==o)).slice(0,2);
 return{p:`그래프의 <b>${isX?'가로':'세로'}</b>는 무엇을 나타내나요?`,g,ch:shuffle([a,o,...pool]),a,e:`왼쪽 아래 칸을 보세요! 가로는 <b>${g.c.x}</b>, 세로는 <b>${g.c.y}</b>를 나타내요.`}},
